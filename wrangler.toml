name = "web-portfolio"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2026-04-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[assets]
directory = "./dist/client"
binding = "ASSETS"

[ai]
binding = "AI"
remote = true

[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false
persist = false

[observability.traces]
enabled = false

[[routes]]
pattern = "marcodantonio.it"
custom_domain = true

[[routes]]
pattern = "www.marcodantonio.it"
custom_domain = true

# Secrets — set via: wrangler secret put <NAME>
# Required:
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put TURNSTILE_SECRET_KEY
